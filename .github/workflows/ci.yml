name: CloudPulse AI CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudpulse-ai:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/cloudpulse-ai:latest

  update-helm:
    name: Update Helm Image Tag
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Helm image tag
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          echo "Updating Helm image tag to: ${IMAGE_TAG}"

          sed -i.bak \
            "s|^[[:space:]]*tag: .*|tag: ${IMAGE_TAG}|" \
            helm/cloudpulse-ai/values.yaml

          rm -f helm/cloudpulse-ai/values.yaml.bak

      - name: Commit and push Helm changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/cloudpulse-ai/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit"
          else
            git commit -m "chore: update CloudPulse AI image tag [skip ci]"
            git push origin main
          fi