name: CloudPulse AI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    # Prevent an infinite loop when the workflow updates values.yaml
    if: "!contains(github.event.head_commit.message, 'Update image tag')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Test application
        run: |
          python -m compileall app

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/prathameshpp-007/cloudpulse-ai:latest
            ghcr.io/prathameshpp-007/cloudpulse-ai:${{ github.sha }}

      - name: Update Helm image tag
        if: github.event_name == 'push'
        run: |
          sed -i.bak 's|tag: ".*"|tag: "${{ github.sha }}"|' helm/cloudpulse-ai/values.yaml
          rm helm/cloudpulse-ai/values.yaml.bak

      - name: Commit updated image tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/cloudpulse-ai/values.yaml
          git diff --staged --quiet || git commit -m "Update image tag to ${{ github.sha }}"
          git pushame: CloudPulse AI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-test-and-push:
    # Don't rebuild when the workflow itself updates only the Helm image tag
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Test application
        run: |
          python -m compileall app

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/prathameshpp-007/cloudpulse-ai:latest
            ghcr.io/prathameshpp-007/cloudpulse-ai:${{ github.sha }}

      - name: Update Helm image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s|tag: \".*\"|tag: \"${{ github.sha }}\"|" helm/cloudpulse-ai/values.yaml

      - name: Commit and push Helm image tag
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/cloudpulse-ai/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit"
          else
            git commit -m "chore: update CloudPulse AI image tag [skip ci]"
            git push
          fi
