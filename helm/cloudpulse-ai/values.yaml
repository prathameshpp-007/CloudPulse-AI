replicaCount: 2

image:
  repository: ghcr.io/prathameshpp-007/cloudpulse-ai
  pullPolicy: Always
  tag: fad449a17745

service:
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30082

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

database:
  host: cloudpulse-db
  secretName: cloudpulse-db-secret