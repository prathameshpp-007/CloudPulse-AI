apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse-ai.fullname" . }}
  labels:
    {{- include "cloudpulse-ai.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "cloudpulse-ai.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}