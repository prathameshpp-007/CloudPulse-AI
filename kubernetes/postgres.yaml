apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-db-secret
type: Opaque
stringData:
  POSTGRES_DB: cloudpulse
  POSTGRES_USER: cloudpulse_user
  POSTGRES_PASSWORD: cloudpulse_password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpulse-db
  template:
    metadata:
      labels:
        app: cloudpulse-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: cloudpulse-db-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-db
spec:
  selector:
    app: cloudpulse-db
  ports:
    - port: 5432
      targetPort: 5432