services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-api
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: cloudpulse-db
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: cloudpulse_user
      POSTGRES_PASSWORD: cloudpulse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: