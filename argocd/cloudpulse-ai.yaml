apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudpulse-ai
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/prathameshpp-007/CloudPulse-AI.git
    targetRevision: main
    path: helm/cloudpulse-ai

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
